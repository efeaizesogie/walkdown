modules:
  rovo:agent:
    - key: walkdown-auditor
      name: Walkdown Auditor
      icon: resource:main;icon.svg
      description: A mock medical-device software auditor. Samples requirements by risk, walks each trace end to end and grades the gaps like a real audit.
      prompt: resource:agent-prompts;auditor.txt
      conversationStarters:
        - Run an audit rehearsal on GLU, 10 samples
        - What are the open findings?
        - Trace GLU-2 like an auditor would
        - Is our readiness improving?
      actions:
        - run-rehearsal
        - get-findings
        - get-readiness
        - trace-requirement
        - post-auditor-question
  action:
    - key: run-rehearsal
      name: Run audit rehearsal
      function: runRehearsalAction
      actionVerb: GET
      description: Samples requirements weighted by IEC 62304 safety class and risk, walks each trace (design, implementation, verification, risk control, release) and grades findings as major, minor or observation with clause references. Returns the readiness score.
      inputs:
        projectKey:
          title: Project key
          type: string
          required: false
          description: Jira project key holding the requirements. Defaults to GLU.
        samples:
          title: Number of samples
          type: integer
          required: false
          description: How many requirements to sample, 1 to 50. Defaults to 10.
        safetyClass:
          title: Minimum safety class
          type: string
          required: false
          description: Only sample requirements of this IEC 62304 class or higher, A, B or C.
    - key: get-findings
      name: Get audit findings
      function: getFindings
      actionVerb: GET
      description: Returns the findings, readiness score and auditor questions from the latest rehearsal.
      inputs:
        projectKey:
          title: Project key
          type: string
          required: false
          description: Jira project key. Defaults to GLU.
    - key: get-readiness
      name: Get readiness trend
      function: getReadiness
      actionVerb: GET
      description: Returns the readiness score of recent rehearsals, oldest first, to show whether audit readiness is improving.
      inputs:
        projectKey:
          title: Project key
          type: string
          required: false
          description: Jira project key. Defaults to GLU.
    - key: trace-requirement
      name: Trace a requirement
      function: traceRequirement
      actionVerb: GET
      description: Walks one requirement's trace end to end and returns each link with its evidence and source, the first broken link and the auditor's finding.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: true
          description: The Jira work item key of the requirement, for example GLU-12.
    - key: post-auditor-question
      name: Post auditor question
      function: postAuditorQuestion
      actionVerb: CREATE
      description: Posts an auditor's follow-up question as a comment on a Jira work item.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: true
          description: The Jira work item key to comment on.
        question:
          title: Question
          type: string
          required: true
          description: The auditor's question, for example "Show me the verification record for GLU-2."
  rovo:skill:
    - key: audit-sampling
      source:
        dir: skills/audit-sampling
      dependencies:
        tools:
          - run-rehearsal
          - trace-requirement
          - get-findings
  rovo:mcp:
    - key: walkdown-mcp
      name: Walkdown
      tools:
        - run-rehearsal
        - get-findings
        - get-readiness
        - trace-requirement
  jira:workflowValidator:
    - key: trace-validator
      name: Walkdown trace check
      description: Blocks a transition when a requirement's trace (design, implementation, verification, risk control) is broken.
      function: validateTrace
      projectTypes:
        - company-managed
        - team-managed
  trigger:
    - key: rehearsal-trigger
      function: onIssueCreated
      events:
        - avi:jira:created:issue
  consumer:
    - key: walkdown-sample-consumer
      queue: walkdown-sample
      function: sampleConsumer
    - key: walkdown-rehearsal-consumer
      queue: walkdown-rehearsal
      function: rehearsalConsumer
  devops:developmentInfoProvider:
    - key: walkdown-sample-devinfo
      name:
        value: GlucoLoop sample repository
      homeUrl: https://developer.atlassian.com/platform/forge/
      logoUrl: https://developer.atlassian.com/favicon.ico
      documentationUrl: https://developer.atlassian.com/platform/forge/
  jira:globalPage:
    - key: walkdown-home
      resource: main
      resolver:
        function: resolver
      title: Walkdown
      icon: resource:main;icon.svg
      layout: blank
  jira:issueContext:
    - key: walkdown-issue-panel
      resource: main
      resolver:
        function: resolver
      title: Walkdown trace
      label: Walkdown trace
      icon: resource:main;icon.svg
  function:
    - key: traceRequirement
      handler: index.traceRequirement
    - key: runRehearsalAction
      handler: index.runRehearsalAction
    - key: getFindings
      handler: index.getFindings
    - key: getReadiness
      handler: index.getReadiness
    - key: postAuditorQuestion
      handler: index.postAuditorQuestion
    - key: validateTrace
      handler: index.validateTrace
    - key: onIssueCreated
      handler: index.onIssueCreated
    - key: rehearsalConsumer
      handler: index.rehearsalConsumer
      timeoutSeconds: 900
    - key: sampleConsumer
      handler: index.sampleConsumer
      timeoutSeconds: 900
    - key: resolver
      handler: index.resolver
resources:
  - key: agent-prompts
    path: prompts
  - key: main
    path: ui/dist
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:jira-user
    - manage:jira-configuration
    - manage:jira-project
    - write:dev-info:jira
    - read:dev-info:jira
    - storage:app
    - read:confluence-content.summary
    - write:confluence-content
    - write:confluence-space
    - read:confluence-space.summary
    - read:page:confluence
    - write:page:confluence
    - read:space:confluence
    - write:space:confluence
    - read:graph:issue:jira
    - read:graph:page:confluence
    - read:graph:commit:external
    - read:graph:pull-request:external
    - read:graph:branch:external
    - read:graph:repository:external
    - read:graph:deployment:external
    - read:graph:build:external
app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/b76b5155-9742-4c85-b2ec-10bf789babad
  rovo:
    tag: walkdown
    description: Rehearse a medical-device software audit; trace requirements and grade the gaps.
    keywords:
      - audit
      - iec62304
      - traceability
      - iso14971
